name: Update version badge

on:
  push:
    branches: [main]
    paths:
      - 'toc-bar.user.js'

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          ver=$(grep -oP '@version\s+\K[\d.]+' toc-bar.user.js)
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Update README badge
        run: |
          sed -i "/shields\.io.*Install-/s/v[0-9.]\+/v${{ steps.version.outputs.version }}/" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync badge version to v${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi
